name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        description: 'If not specified, all packages will be released.'
        options:
          - ""
          - generate_parameter_library
          - generate_parameter_library_py
          - generate_parameter_library_rs
          - parameter_traits

concurrency: release

jobs:
  release:
    runs-on: 2vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: greenroom-robotics/mise/.github/actions/release@v8
        with:
          package: ${{ inputs.package }}
          package-dir: .
          changelog: false
          gh-app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          extra-git-assets: ${{ inputs.package == 'generate_parameter_library_rs' && 'generate_parameter_library_rs/Cargo.toml generate_parameter_library_rs/Cargo.lock' || inputs.package == '' && 'Cargo.toml Cargo.lock' || '' }}
          extra-prepare-cmd: ${{ inputs.package == 'generate_parameter_library_rs' && 'mise ci sync-cargo --version=${nextRelease.version} --cargo-toml=generate_parameter_library_rs/Cargo.toml --cargo-lock=generate_parameter_library_rs/Cargo.lock --package=generate_parameter_library_rs' || inputs.package == '' && '[ ! -f Cargo.toml ] || mise ci sync-cargo --version=${nextRelease.version} --package=generate_parameter_library_rs' || '' }}
