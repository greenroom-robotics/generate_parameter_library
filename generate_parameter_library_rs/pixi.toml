[workspace]
name = "generate_parameter_library_rs"
channels = [
  "az://stgrcondachannel.blob.core.windows.net/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
generate_parameter_library_rs = { path = "." }

[package]
name = "generate_parameter_library_rs"
version = "1.0.0"
description = "build.rs helper that generates rclrs parameter code with generate_parameter_library_py"
license = "BSD-3-Clause"
authors = ["Greenroom Robotics <software-team@greenroomrobotics.com>"]

[package.build.backend]
name = "pixi-build-ros-gr"
version = "*"

[package.build.config]
mode = "pixi-native"
build-type = "ament_cargo"
distro = "kilted"

[package.run-dependencies]
ros-kilted-generate-parameter-library-py = "*"
